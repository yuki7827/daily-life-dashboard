<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }} | {{ site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4a90e2;
    --accent-soft: #eaf3fc;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #1a1d23;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #2a2f38;
      --accent: #5fa3ec;
      --accent-soft: #1e2a3a;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  .nav {
    display: flex; gap: 12px; align-items: center;
    font-size: 0.85rem; padding: 8px 0; margin-bottom: 8px;
  }
  .nav a { color: var(--accent); text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  .header {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .header h1 {
    font-size: 1.5rem;
    margin: 0 0 6px 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .header .meta {
    color: var(--muted);
    font-size: 0.9rem;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .header .meta .badge {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 500;
    font-size: 0.8rem;
  }
  .content { display: flex; flex-direction: column; gap: 14px; }
  .content h2 {
    font-size: 1.05rem;
    margin: 0 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent-soft);
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .content h3 {
    font-size: 0.95rem;
    margin: 16px 0 6px 0;
    font-weight: 600;
    color: var(--accent);
  }
  /* sectionize each h2 by wrapping in cards via JS */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    box-shadow: var(--shadow);
  }
  .card ul, .card ol { padding-left: 1.4em; margin: 8px 0; }
  .card li { margin: 4px 0; }
  .card p { margin: 8px 0; }
  .card a { color: var(--accent); }
  .card strong { color: var(--text); }
  .card hr { display: none; }
  .card table {
    width: 100%; border-collapse: collapse; margin: 12px 0;
    font-size: 0.92rem;
  }
  .card th, .card td {
    text-align: left; padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  .card th { color: var(--muted); font-weight: 600; }
  .card blockquote {
    margin: 8px 0; padding: 8px 14px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
  }
  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 24px 0 16px;
  }
  .footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a href="{{ '/' | relative_url }}">← 最新</a>
    <a href="{{ '/archive.html' | relative_url }}">過去ログ</a>
  </div>

  <div class="header">
    <h1>{{ page.title }}</h1>
    <div class="meta">
      <span>{{ page.date | date: "%Y-%m-%d (%a)" }}</span>
      {% if page.location %}<span class="badge">{{ page.location }}</span>{% endif %}
    </div>
  </div>

  <div id="content" class="content">{{ content }}</div>

  <div class="footer">
    Generated by Claude Code Routine ・ <a href="https://github.com/yuki7827/daily-life-dashboard">source</a>
  </div>
</div>

<script>
// Wrap each <h2> + following siblings (until next <h2>) in a .card div
(function() {
  var content = document.getElementById('content');
  if (!content) return;
  var nodes = Array.from(content.childNodes);
  var groups = [];
  var current = null;
  nodes.forEach(function(n) {
    if (n.nodeType === 1 && n.tagName === 'H2') {
      current = { items: [n] };
      groups.push(current);
    } else if (current) {
      current.items.push(n);
    } else {
      // pre-h2 content: wrap by itself
      current = { items: [n] };
      groups.push(current);
      current = null;
    }
  });
  content.innerHTML = '';
  groups.forEach(function(g) {
    var card = document.createElement('div');
    card.className = 'card';
    g.items.forEach(function(n) { card.appendChild(n); });
    content.appendChild(card);
  });
})();
</script>
</body>
</html>
