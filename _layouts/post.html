<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }} | {{ site.title }}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; line-height: 1.6; }
  h1 { font-size: 1.4rem; border-bottom: 1px solid #8884; padding-bottom: 8px; }
  h2 { font-size: 1.1rem; margin-top: 1.6em; border-left: 4px solid #4a90e2; padding-left: 8px; }
  h3 { font-size: 1rem; }
  ul { padding-left: 1.2em; }
  .meta { color: #888; font-size: 0.85rem; }
  .nav { font-size: 0.9rem; margin: 12px 0; }
  hr { border: none; border-top: 1px solid #8884; margin: 2em 0; }
</style>
</head>
<body>
<div class="nav"><a href="{{ '/' | relative_url }}">← 最新</a> | <a href="{{ '/archive.html' | relative_url }}">過去ログ</a></div>
<h1>{{ page.title }}</h1>
<div class="meta">{{ page.date | date: "%Y-%m-%d (%a)" }} ／ {{ page.location }}</div>
{{ content }}
<hr>
<div class="meta">Generated by Claude Code Routine</div>
</body>
</html>
