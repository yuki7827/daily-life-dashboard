# 各セクションの参照URL。Routineはここに列挙されたURLを参照する。
# 取得方針: まず WebSearch (search_query) を試み、本文詳細が必要な場合のみ url へ WebFetch。
# WebFetch は Custom/Full 環境でのみ成功する。Default 環境では WebSearch のみで対応。

weather:
  # WebFetch用（Custom/Full環境）
  jma_forecast_tokyo: "https://www.jma.go.jp/bosai/forecast/data/forecast/130000.json"
  jma_forecast_saitama: "https://www.jma.go.jp/bosai/forecast/data/forecast/110000.json"
  tenki_tokyo: "https://tenki.jp/forecast/3/16/4410/13000/"
  tenki_saitama_south: "https://tenki.jp/forecast/3/14/4310/11220/"
  # WebSearch用クエリ（Default環境フォールバック）
  search_query_tokyo: "東京 世田谷区 天気予報 今日 最高気温 降水確率"
  search_query_saitama: "埼玉県南部 ふじみ野市 天気予報 今日 最高気温 降水確率"

pollen:
  # WebFetch用（Custom/Full環境）
  tenki_pollen_tokyo: "https://tenki.jp/pollen/3/16/"
  tenki_pollen_saitama: "https://tenki.jp/pollen/3/14/"
  # WebSearch用クエリ
  search_query_tokyo: "東京 花粉 飛散 今日 ヒノキ スギ レベル"
  search_query_saitama: "埼玉 花粉 飛散 今日 レベル"

