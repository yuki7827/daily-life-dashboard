  - name: "ガスト・すかいらーくグループ（バーミヤン/ジョナサン/夢庵/しゃぶ葉等）"
    url: "https://www.skylark.co.jp/gusto/menu/grand_menu.html"
    search_query: "ガスト すかいらーく クーポン 割引 アプリ dポイント 2026年"
  - name: "マクドナルド"
    url: "https://www.mcdonalds.co.jp/campaign/"
    search_query: "マクドナルド クーポン お得 キャンペーン 2026年"
  - name: "サイゼリヤ"
    url: "https://www.saizeriya.co.jp/whatsnew/"
    search_query: "サイゼリヤ クーポン キャンペーン 2026年"
  - name: "デニーズ"
    url: "https://www.dennys.jp/news/"
    search_query: "デニーズ クーポン キャンペーン 2026年"
  - name: "丸亀製麺"
    url: "https://www.marugame-seimen.com/news/"
    search_query: "丸亀製麺 クーポン キャンペーン 半額 2026年"
  - name: "スターバックス"
    url: "https://www.starbucks.co.jp/whatsnew/"
    search_query: "スターバックス キャンペーン お得 2026年"
  - name: "牛丼チェーン（すき家/吉野家/松屋）"
    search_query: "すき家 吉野家 松屋 クーポン 割引 キャンペーン 2026年"
  - name: "ファストフード（KFC/モスバーガー/ロッテリア）"
    search_query: "ケンタッキー モスバーガー クーポン パック お得 2026年"
  - name: "回転寿司（スシロー/はま寿司/くら寿司/かっぱ寿司）"
    search_query: "スシロー はま寿司 くら寿司 クーポン キャンペーン 2026年"
  - name: "ピザ（ドミノ/ピザハット/ピザーラ）"
    search_query: "ドミノピザ ピザハット 半額 クーポン 2026年"
  - name: "カフェ（ドトール/タリーズ/コメダ/ミスド）"
    search_query: "ドトール タリーズ コメダ ミスタードーナツ クーポン キャンペーン 2026年"
  - name: "外食キャンペーン横断まとめ"
    search_query: "飲食チェーン クーポン キャンペーン まとめ 2026年6月"
  # --- まとめ系サイト（WebFetchで直接取得。2026-06-12 取得可否検証済み） ---
  - name: "グルメWatch（Impress）"
    url: "https://gourmet.watch.impress.co.jp/"
    note: "外食チェーンのキャンペーン・クーポンニュースが当日更新。期間限定割引の発見に最適"
  - name: "クーポン倶楽部"
    url: "https://tasdesign.co.jp/media/"
    note: "チェーン別の最新クーポンを割引額つきで随時更新"
  - name: "ゆるなご お得情報まとめ"
    url: "https://yurunago.or.jp/gourmet-hub/otoku-campaign/"
    note: "飲食・コンビニ横断の随時更新まとめ。複数月の情報が混在するため日付の確認必須"
  - name: "得北 毎月のお得デー一覧（静的）"
    url: "https://tokukita.jp/service/otokunahi.html"
    note: "毎月1日=丸亀製麺釜揚げ半額、28日=KFCとりの日、29日=焼肉ライク半額 等。実行日の日付と突合して該当日のみ掲載"
  - name: "ぴよのよいち 今月のチェーン店グルメお得情報総まとめ"
    url: "https://piyoch.com/otokugourmet/"
    note: "チェーン店ごとに割引額・期間が具体的にまとまっている。2026-06-14 検証済み（スシロー/かっぱ寿司/バーミヤン等の有効な情報を取得できた）"
  - name: "ココトク グルメカテゴリ"
    url: "https://kojinabi.com/blog-category-21.html"
    note: "個別キャンペーン記事へのリンク一覧。記事ごとに期間・割引額が明記。2026-06-14 検証済み"

# オンラインショップお得情報（楽天市場・Yahoo!ショッピング・Amazon など）
online_shopping:
  - name: "楽天市場"
    search_query: "楽天市場 セール お買い物マラソン スーパーセール 開催 今日 2026年"
    note: "0と5のつく日・お買い物マラソン・スーパーSALE・勝ったら倍などの開催状況"
  - name: "Yahoo!ショッピング"
    search_query: "Yahoo!ショッピング 5のつく日 PayPay 還元 キャンペーン 今日 2026年"
    note: "5のつく日・ゾロ目の日・PayPayポイント還元キャンペーン"
  - name: "Amazon"
    search_query: "Amazon セール タイムセール プライム 開催 今日 2026年"
    note: "タイムセール祭り・プライムデー等の大型セール開催時のみ掲載"
  - name: "その他EC（au PAYマーケット/Qoo10/ZOZOTOWN等）"
    search_query: "au PAYマーケット Qoo10 ZOZOTOWN セール ポイント 今日 2026年"
    note: "大きな還元・セールがある場合のみ掲載"
  # --- まとめ系サイト（2026-06-12 検証済み） ---
  - name: "カイドキ Amazonセール年間スケジュール"
    url: "https://mag.app-liv.jp/archive/132115/"
    note: "Amazonの直近・次回セールの開催日が具体的。「次の買い時」の日付取得用"
  - name: "アプリオ 楽天市場お得な日まとめ"
    url: "https://appllio.com/rakuten-ichiba-deals-day"
    note: "当月の楽天ポイントアップ日・セール日程の一覧"

# キャッシュレス・公式アプリお得情報
cashless_apps:
  - name: "PayPay（自治体還元を最優先で確認）"
    search_query: "PayPay キャンペーン 還元 自治体 埼玉 富士見市 今日 2026年"
    url: "https://paypay.ne.jp/event/"
    note: "全国・埼玉県・富士見市の自治体還元、PayPayジャンボ・超PayPay祭等。規約変更の注意喚起も拾う"
  - name: "d払い・楽天ペイ・au PAY・メルペイ"
    search_query: "d払い 楽天ペイ au PAY メルペイ キャンペーン 還元 2026年"
    note: "主要バーコード決済の還元キャンペーン。埼玉県・近隣自治体の地域還元も確認"
  - name: "ぺいさん note（カード・タッチ決済キャンペーン詳細）"
    url: "https://note.com/pay_sann/"
    note: "Visa割等のタッチ決済・クレカキャンペーンを条件・上限・対象店舗つきで詳報。2026-07-12 ユーザー提案。月替わりの最新記事を確認"
  - name: "Visa公式 プロモーション"
    url: "https://www.visa.co.jp/about-visa/promotions.html"
    search_query: "Visa割 タッチ決済 キャンペーン 対象店舗 今月"
    note: "タッチでVisa割（対象店10%キャッシュバック等）の一次ソース。対象外店舗リストも必ず確認"
  - name: "ダイヤモンドZAi クレジットカードおすすめ"
    url: "https://diamond.jp/zai/category/creditcard-osusume"
    note: "クレジットカード中心の比較・キャンペーン記事。外食チェーン×カード還元など店舗とカードを組み合わせたお得情報があれば外食欄と相互参照。2026-06-14 ユーザー提案"
  - name: "お得の博士"
    url: "https://www.haiji-doctor.com/"
    note: "キャッシュレス決済・ポイント関連キャンペーンに特化（PayPay/d払い/楽天ポイント/ウエル活等の公式キャンペーンリンク集）。2026-06-14 ユーザー提案・検証済み"
  - name: "スーパー公式アプリ（ヤオコー/マルエツ/ベルク/サミット）"
    search_query: "ヤオコー マルエツ ベルク アプリ クーポン ポイント 2026年"
    note: "近隣スーパーのアプリ限定クーポン・ポイントデー"
  # --- まとめ系サイト（2026-06-12 検証済み） ---
  - name: "こじナビ 自治体キャッシュレス還元まとめ"
    url: "https://kojinabi.com/"
    search_query: "kojinabi 自治体 キャッシュレス 還元 まとめ 当月"
    note: "月替わりの個別記事に埼玉県内の還元率・期間・上限が具体的に載る。トップから当月記事を探すか検索で個別記事URLを特定。⚠ 自治体名の誤帰属が起きやすい（例: 春日部市ふじちゃんポイント）。掲載前に必ず公式一次ソースで自治体名を裏取りする"
  - name: "ITmedia Mobile 月例スマホ決済キャンペーンまとめ"
    search_query: "ITmedia あなたの街のスマホ決済キャンペーンまとめ 当月"
    note: "PayPay/d払い/au PAY/楽天ペイの地域還元を月次で網羅。月初に更新"

