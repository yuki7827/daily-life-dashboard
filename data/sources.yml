# 各セクションの参照URL。ローカル実行のためWebFetchを優先し、失敗時にWebSearchへフォールバック。
# このリストは「検索の起点」。記載外のチェーン・サイト・施設も幅広く検索してよい（CLAUDE.md 品質方針参照）。
# 居住地: 埼玉県富士見市（最寄り ふじみ野駅）

weather:
  jma_forecast_saitama: "https://www.jma.go.jp/bosai/forecast/data/forecast/110000.json"
  jma_warning_saitama: "https://www.jma.go.jp/bosai/warning/data/warning/110000.json"  # 警報・注意報（防災チェック用）
  yahoo_fujimi: "https://weather.yahoo.co.jp/weather/jp/11/4310/11235.html"
  tenki_saitama_south: "https://tenki.jp/forecast/3/14/4310/11220/"
  search_query: "埼玉県南部 富士見市 天気予報 今日 最高気温 降水確率"
  disaster_search_query: "埼玉県 台風 大雨 警報 注意報 熱中症警戒アラート 今日"

pollen:
  tenki_pollen_saitama: "https://tenki.jp/pollen/3/14/"
  search_query: "埼玉 花粉 飛散 今日 レベル"

# 外食キャンペーン（割引・クーポン優先）。下記は起点。牛丼・回転寿司・カフェ・ピザ等も幅広く検索する。
